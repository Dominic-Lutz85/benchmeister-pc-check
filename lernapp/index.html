  html += '<p class="lead">Vom ersten HTML-Tag bis zum abgerechneten Kundenprojekt. Jeden Tag ein Stueck, in einer Reihenfolge, in der nichts vorausgesetzt wird, was noch nicht dran war.</p>';
  html += "</div>";

  html += '<div class="zahlenreihe">';
  html += '<div class="zahl"><b>' + fertig + " / " + ALLE.length + '</b><span class="etikett">Kapitel erledigt</span></div>';
  html += '<div class="zahl"><b>' + Math.round(restMin/60) + ' h</b><span class="etikett">Lernzeit uebrig</span></div>';
  html += '<div class="zahl"><b>' + tageRest + '</b><span class="etikett">Tage bei ' + Z.zielMin + ' Min</span></div>';
  html += '<div class="zahl"><b>' + serie() + '</b><span class="etikett">Tage in Folge</span></div>';
  html += "</div>";

  html += '<section class="abschnitt"><h2>Dein Pensum heute</h2>';
  if(pensum.length === 0){
    html += '<p class="leer">Alles durch. Zeit fuer Projekt 6, oder such dir ein Kapitel zum Auffrischen.</p>';
  }else{
    html += '<ul class="heuteliste">';
    pensum.forEach(function(k){
      html += '<li data-kap="' + k.id + '">'
           + '<span class="hnr mono">LF ' + String(k.lfNr).padStart(2,"0") + ' &middot; K ' + k.kNr + '</span>'
           + '<span><span class="htitel">' + esc(k.t) + '</span><span class="hfeld">' + esc(k.lfName) + '</span></span>'
           + '<span class="hnr mono">' + k.min + " Min" + '</span></li>';
    });
    html += "</ul>";
    html += '<p class="hinweis" style="margin-top:14px">Zusammen ' + pensum.reduce(function(s,k){return s+k.min;},0)
         + ' Minuten. Weniger ist auch in Ordnung: die Serie zaehlt schon ab einem erledigten Kapitel.</p>';
  }
  html += "</section>";

  html += '<section class="abschnitt"><h2>Die zwoelf Lernfelder</h2><div class="felderraster">';
  LEHRPLAN.forEach(function(lf){
    const a = feldAnteil(lf.nr);
    html += '<button class="feldkachel" data-feld-start="' + lf.nr + '">'
         + '<span class="knr">LERNFELD ' + String(lf.nr).padStart(2,"0") + ' &middot; ' + a.fertig + "/" + a.alle + '</span>'
         + '<h3>' + esc(lf.name) + '</h3>'
         + '<p style="margin:0; font-size:14px; color:var(--gedaempft)">' + esc(lf.kurz) + '</p>'
         + '<span class="mini"><i style="width:' + Math.round(a.anteil*100) + '%"></i></span>'
         + '</button>';
  });
  html += "</div></section>";

  html += '<div class="trenner"></div>';
  html += '<section class="abschnitt"><h2>So ist der Kurs gebaut</h2><ul class="kernliste">'
       + '<li><span><b>Reihenfolge zaehlt.</b> Die Lernfelder bauen aufeinander auf. Du kannst springen, aber Lernfeld 5 setzt voraus, dass du 3 und 4 gebaut hast, nicht nur gelesen.</span></li>'
       + '<li><span><b>Jedes Kapitel hat eine Aufgabe.</b> Gelesen ist nicht gelernt. Das Kapitel gilt erst als erledigt, wenn die Praxisaufgabe gemacht ist.</span></li>'
       + '<li><span><b>Sechs Projekte statt Zertifikat.</b> Nach bestimmten Lernfeldern wird ein Projekt frei. Am Ende hast du ein Portfolio, nicht eine Urkunde.</span></li>'
       + '<li><span><b>Die Videos sind Suchlinks, keine festen Videos.</b> Einzelne Videos verschwinden, eine Suche mit dem richtigen Begriff nicht. Der empfohlene Kanal steht dabei.</span></li>'
       + "</ul></section>";

  document.getElementById("blatt").innerHTML = html;
}

/* ---------- Projekte ---------- */
function zeichneProjekte(){
  let html = '<p class="pfad">Praxis</p><h1 style="margin-bottom:10px">Sechs Projekte</h1>';
  html += '<p class="lead" style="margin-bottom:28px">Wissen, das nie gebaut wurde, verschwindet. Jedes Projekt wird frei, sobald die noetigen Lernfelder durch sind, und jedes ist am Ende portfoliotauglich.</p>';
  html += '<div class="projekte">';
  PROJEKTE.forEach(function(p){
    const frei = LEHRPLAN.filter(function(lf){return lf.nr <= p.nach;}).every(function(lf){return feldFertig(lf.nr);});
    html += '<article class="projekt" data-frei="' + (frei ? "ja" : "nein") + '">';
    html += '<span class="stufe">' + esc(p.stufe) + ' &middot; ' + esc(p.dauer) + '</span>';
    html += "<h3>" + esc(p.name) + "</h3>";
    html += '<p style="margin:0; max-width:62ch">' + esc(p.ziel) + "</p>";
    html += "<ul>" + p.punkte.map(function(x){return "<li>" + esc(x) + "</li>";}).join("") + "</ul>";
    html += frei
      ? '<span class="marke-frei">&#10003; frei ab jetzt</span>'
      : '<span class="marke-zu">frei nach Lernfeld ' + p.nach + "</span>";
    html += "</article>";
  });
  html += "</div>";
  document.getElementById("blatt").innerHTML = html;
}

/* ---------- Kapitelansicht ---------- */
function zeichneKapitel(id){
  const k = kapVon(id);
  if(!k){ zeichneStart(); return; }
  const fertig = istFertig(k.id);
  const naechst = ALLE[k.pos + 1] || null;
  const vorher = ALLE[k.pos - 1] || null;

  let html = '<p class="pfad">Lernfeld ' + String(k.lfNr).padStart(2,"0") + " &middot; " + esc(k.lfName)
           + " &middot; Kapitel " + k.kNr + " &middot; " + k.min + " Min</p>";
  html += "<h1>" + esc(k.t) + "</h1>";
  html += '<p class="ziel">' + esc(k.ziel) + "</p>";

  html += '<section class="abschnitt"><h2>Das musst du wissen</h2><ul class="kernliste">'
       + k.kern.map(function(x){return "<li><span>" + x + "</span></li>";}).join("")
       + "</ul></section>";

  html += '<section class="abschnitt"><h2>Aufgabe</h2><div class="praxis"><h3>Selber machen</h3><p>'
       + k.praxis + "</p></div></section>";

  html += '<section class="abschnitt"><h2>Selbstpruefung</h2><div class="selbstcheck"><p>'
       + k.check + "</p></div>"
       + '<p class="hinweis" style="margin-top:10px">Antworte laut, in eigenen Worten. Wenn du stockst, ist das die Stelle zum Nachlesen.</p></section>';

  html += '<section class="abschnitt"><h2>Video und Quellen</h2><div class="quellen">';
  html += '<a class="quelle film" href="' + videoLink(k.v) + '" target="_blank" rel="noopener">&#9654; Videosuche <small>' + esc(k.v[1]) + "</small></a>";
  k.q.forEach(function(qu){
    html += '<a class="quelle" href="' + esc(qu[1]) + '" target="_blank" rel="noopener">' + esc(qu[0]) + "</a>";
  });
  html += "</div></section>";

  html += '<section class="abschnitt"><h2>Deine Notiz</h2>'
       + '<textarea class="notiz" id="notiz" placeholder="Was hast du gebaut? Was hat nicht funktioniert? Wo willst du nochmal ran?">'
       + esc(Z.notizen[k.id] || "") + "</textarea>"
       + '<span class="notizstand" id="notizstand">wird beim Tippen gespeichert</span></section>';

  html += '<section class="abschnitt" id="lehrer-bereich" hidden><h2>Nachfragen</h2>'
       + '<div class="lehrer"><form id="lehrer-form">'
       + '<input id="lehrer-frage" placeholder="Frag zu diesem Kapitel, zum Beispiel: warum ruckelt margin?" aria-label="Frage zu diesem Kapitel">'
       + '<button class="knopf stark" type="submit">Fragen</button></form>'
       + '<div class="antwort" id="lehrer-antwort" hidden></div></div></section>';

  html += '<div class="fussleiste">';
  html += '<button class="knopf ' + (fertig ? "" : "stark") + '" id="fertig-knopf">'
       + (fertig ? "&#10003; erledigt, nochmal oeffnen" : "Kapitel erledigt") + "</button>";
  if(vorher) html += '<button class="knopf" data-kap="' + vorher.id + '">&#8592; zurueck</button>';
  if(naechst) html += '<button class="knopf" data-kap="' + naechst.id + '">weiter: ' + esc(naechst.t) + " &#8594;</button>";
  html += '<span class="weiter">' + (k.pos+1) + " von " + ALLE.length + "</span></div>";

  document.getElementById("blatt").innerHTML = html;

  const feld = document.getElementById("notiz");
  let tippZeit = null;
  feld.addEventListener("input", function(){
    Z.notizen[k.id] = feld.value;
    clearTimeout(tippZeit);
    tippZeit = setTimeout(function(){
      merken();
      document.getElementById("notizstand").textContent = "gespeichert " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    }, 500);
  });

  document.getElementById("fertig-knopf").addEventListener("click", function(){
    umschalten(k.id);
  });

  if(sampleHandle) lehrerAnbinden(k);
}

function umschalten(id){
  const k = kapVon(id);
  const war = istFertig(id);
  if(war){
    delete Z.erledigt[id];
  }else{
    Z.erledigt[id] = true;
    const t = heuteDatum();
    Z.tage[t] = (Z.tage[t] || 0) + k.min;
  }
  Z.letzte = id;
  merken();
  zeichnen();
  if(!war){
    const n = ALLE[k.pos + 1];
    if(n) setTimeout(function(){ oeffne(n.id); }, 150);
  }
}

function oeffne(id){
  ansicht = {art:"kapitel", id:id};
  Z.letzte = id; merken();
  zeichnen();
  window.scrollTo({top:0, behavior:"smooth"});
  document.getElementById("schiene").setAttribute("data-offen","nein");
}

function zeichnen(){
  zeichneBand();
  zeichneSchiene();
  if(ansicht.art === "start") zeichneStart();
  else if(ansicht.art === "projekte") zeichneProjekte();
  else zeichneKapitel(ansicht.id);
}
</script>

<script>
"use strict";

/* ---------- Bedienung ---------- */
document.addEventListener("click", function(ev){
  const kap = ev.target.closest("[data-kap]");
  if(kap){ oeffne(kap.getAttribute("data-kap")); return; }

  const kopf = ev.target.closest("[data-feld]");
  if(kopf){
    const feld = kopf.parentElement;
    feld.setAttribute("aria-expanded", feld.getAttribute("aria-expanded") === "true" ? "false" : "true");
    return;
  }
  const kachel = ev.target.closest("[data-feld-start]");
  if(kachel){
    const nr = Number(kachel.getAttribute("data-feld-start"));
    const erstes = ALLE.find(function(k){return k.lfNr === nr && !istFertig(k.id);})
                || ALLE.find(function(k){return k.lfNr === nr;});
    if(erstes) oeffne(erstes.id);
    return;
  }
});

document.getElementById("nav-start").addEventListener("click", function(){
  ansicht = {art:"start", id:null}; zeichnen(); window.scrollTo({top:0});
});
document.getElementById("nav-projekte").addEventListener("click", function(){
  ansicht = {art:"projekte", id:null}; zeichnen(); window.scrollTo({top:0});
});
document.getElementById("ziel-wahl").addEventListener("change", function(e){
  Z.zielMin = Number(e.target.value); merken(); zeichnen();
});
document.getElementById("suche").addEventListener("input", function(e){
  suchbegriff = e.target.value; zeichneSchiene();
});
document.getElementById("schiene-auf").addEventListener("click", function(){
  const s = document.getElementById("schiene");
  s.setAttribute("data-offen", s.getAttribute("data-offen") === "ja" ? "nein" : "ja");
});

/* Helligkeit: die Wahl gilt nur auf diesem Geraet, deshalb bewusst nicht
   im Fortschritt gespeichert. */
const themeKnopf = document.getElementById("theme-knopf");
function themeSetzen(wert){
  if(wert) document.documentElement.setAttribute("data-theme", wert);
  else document.documentElement.removeAttribute("data-theme");
  try{ wert ? localStorage.setItem("werkbank-theme", wert) : localStorage.removeItem("werkbank-theme"); }catch(e){}
}
try{
  const gespeichert = localStorage.getItem("werkbank-theme");
  if(gespeichert) themeSetzen(gespeichert);
}catch(e){}
themeKnopf.addEventListener("click", function(){
  const jetzt = document.documentElement.getAttribute("data-theme");
  const dunkelSystem = window.matchMedia("(prefers-color-scheme: dark)").matches;
  if(!jetzt) themeSetzen(dunkelSystem ? "light" : "dark");
  else themeSetzen(jetzt === "dark" ? "light" : "dark");
});

/* ---------- Nachfragen beim Lehrer (nur wenn verfuegbar) ---------- */
function lehrerAnbinden(k){
  const bereich = document.getElementById("lehrer-bereich");
  if(!bereich) return;
  bereich.hidden = false;
  const form = document.getElementById("lehrer-form");
  const feld = document.getElementById("lehrer-frage");
  const aus = document.getElementById("lehrer-antwort");

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    const frage = feld.value.trim();
    if(!frage) return;
    aus.hidden = false;
    aus.textContent = "Denkt nach ...";
    const knopf = form.querySelector("button");
    knopf.disabled = true;

    const zusammenhang =
      "Du bist ein erfahrener Webdesign-Lehrer und antwortest auf Deutsch, knapp und ohne Floskeln.\n" +
      "Der Lernende ist gerade in diesem Kapitel:\n" +
      "Lernfeld " + k.lfNr + ": " + k.lfName + "\n" +
      "Kapitel: " + k.t + "\n" +
      "Lernziel: " + k.ziel + "\n" +
      "Inhalte: " + k.kern.join(" ").replace(/<[^>]+>/g, "") + "\n\n" +
      "Antworte in hoechstens acht Saetzen. Wenn ein Beispiel hilft, gib ein kurzes Codebeispiel. " +
      "Wenn die Frage ueber das Kapitel hinausgeht, sag in einem Satz, in welchem Lernfeld das drankommt.\n\n" +
      "Frage: " + frage;

    sampleHandle(zusammenhang, {
      modelTier:"default",
      onText:function(d){ aus.textContent = d.text; }
    }).then(function(a){
      aus.textContent = a.text;
    }).catch(function(f){
      aus.textContent = f && f.code === "rate_limited"
        ? "Gerade zu viele Fragen auf einmal. Versuch es in einer Minute nochmal."
        : "Die Antwort kam nicht durch. Frag es nochmal, oder schau in die Quellen oben.";
    }).then(function(){ knopf.disabled = false; });
  });
}

/* ---------- Speichern in der Cloud, wenn der Betrachter das kann ---------- */
async function faehigkeiten(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  try{
    dbHandle = await window.claude.use("db");
    if(dbHandle){
      const doc = await dbHandle.doc("fortschritt/haupt").get();
      const fern = doc && doc.exists ? doc.data : null;
      if(fern && typeof fern.zeit === "number" && fern.zeit > (Z.zeit || 0)){
        Z = Object.assign({}, LEER, fern);
        inSpeicher();
        zeichnen();
      }else if(Z.zeit){
        dbHandle.doc("fortschritt/haupt").set(Z).catch(function(){});
      }
    }
  }catch(e){ dbHandle = null; }

  try{
    sampleHandle = await window.claude.use("sample");
    if(sampleHandle && ansicht.art === "kapitel"){ lehrerAnbinden(kapVon(ansicht.id)); }
  }catch(e){ sampleHandle = null; }

  try{
    downloadsHandle = await window.claude.use("downloads");
    if(downloadsHandle){
      const knopf = document.createElement("button");
      knopf.className = "knopf";
      knopf.textContent = "Notizen sichern";
      knopf.addEventListener("click", function(){
        let text = "# Werkbank Webdesign, Stand " + new Date().toLocaleDateString("de-DE") + "\n\n";
        text += "Erledigt: " + ALLE.filter(function(k){return istFertig(k.id);}).length + " von " + ALLE.length + " Kapiteln\n\n";
        ALLE.forEach(function(k){
          const n = (Z.notizen[k.id] || "").trim();
          if(!n && !istFertig(k.id)) return;
          text += "## LF " + k.lfNr + "." + k.kNr + " " + k.t + (istFertig(k.id) ? "  [erledigt]" : "") + "\n";
          if(n) text += n + "\n";
          text += "\n";
        });
        downloadsHandle.save({filename:"werkbank-webdesign-notizen.md", data:text}).catch(function(){});
      });
      document.querySelector(".bandrest").appendChild(knopf);
    }
  }catch(e){ downloadsHandle = null; }
}

/* ---------- Start ---------- */
(function start(){
  const gespeichert = ausSpeicher();
  if(gespeichert) Z = Object.assign({}, LEER, gespeichert);
  if(Z.letzte && kapVon(Z.letzte) && !istFertig(Z.letzte)) ansicht = {art:"kapitel", id:Z.letzte};
  zeichnen();
  faehigkeiten();
})();
</script>
