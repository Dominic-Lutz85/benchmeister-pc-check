<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Farben immer zuerst im blanken :root, sonst faellt der Standardfall
   (Systemtheme ohne data-theme) auf undefinierte Werte zurueck. */
:root{
  --grund:#EDEFEC; --flaeche:#FBFCFB; --flaeche2:#E4E8E4;
  --tinte:#17211E; --gedaempft:#5D6B67; --linie:#D2D9D4;
  --akzent:#0C6B5E; --akzent-tief:#085147; --akzent-weich:#D8E7E2;
  --heute:#A0691A; --heute-weich:#F2E6D0;
  --warn:#9A3412;
  --schatten:0 1px 2px rgba(23,33,30,.06), 0 8px 24px -16px rgba(23,33,30,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --grund:#101615; --flaeche:#18211F; --flaeche2:#1F2A27;
    --tinte:#E7EDEA; --gedaempft:#94A39E; --linie:#28332F;
    --akzent:#54C2AE; --akzent-tief:#7FD6C6; --akzent-weich:#12312C;
    --heute:#DCA84C; --heute-weich:#332714;
    --warn:#E0855F;
    --schatten:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --grund:#101615; --flaeche:#18211F; --flaeche2:#1F2A27;
  --tinte:#E7EDEA; --gedaempft:#94A39E; --linie:#28332F;
  --akzent:#54C2AE; --akzent-tief:#7FD6C6; --akzent-weich:#12312C;
  --heute:#DCA84C; --heute-weich:#332714;
  --warn:#E0855F;
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--grund); color:var(--tinte);
  font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;
  font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  font-weight:700; line-height:1.12; text-wrap:balance; margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--akzent-tief); text-underline-offset:.18em}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--akzent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* ---------- Grundgeruest ---------- */
.huelle{display:grid; grid-template-columns:302px minmax(0,1fr); min-height:100vh}
.schiene{
  border-right:1px solid var(--linie); background:var(--flaeche);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
}
.marke{padding:20px 22px 14px; border-bottom:1px solid var(--linie)}
.marke .wort{font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:20px; letter-spacing:-.02em; display:block}
.marke .zusatz{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--gedaempft); margin-top:4px; display:block}
.suchfeld{padding:12px 16px; border-bottom:1px solid var(--linie)}
.suchfeld input{
  width:100%; padding:8px 10px; border:1px solid var(--linie); border-radius:6px;
  background:var(--grund); color:var(--tinte); font-family:"IBM Plex Mono",monospace; font-size:13px;
}
.schienenliste{overflow-y:auto; flex:1; padding:10px 0 40px}

/* Rueckgrat: eine durchgehende Linie durch den ganzen Lehrplan, gefuellt
   bis zum erreichten Punkt. Ersetzt bewusst die uebliche Kartenliste. */
.feld{position:relative}
.feldkopf{
  display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:8px;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:9px 16px 9px 0;
}
.feldkopf:hover .feldname{color:var(--akzent-tief)}
.nummer{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gedaempft);
  text-align:center; position:relative; z-index:1; background:var(--flaeche); padding:2px 0;
}
.feld::before{
  content:""; position:absolute; left:17px; top:0; bottom:0; width:2px;
  background:var(--linie);
}
.feld[data-fertig="ja"]::before{background:var(--akzent)}
.feldname{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:14.5px; line-height:1.25}
.feldzahl{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gedaempft); padding-right:2px}
.kapitel{list-style:none; margin:0; padding:0 12px 8px 34px; display:none}
.feld[aria-expanded="true"] .kapitel{display:block}
.kapitel li{margin:0}
.kaplink{
  display:grid; grid-template-columns:16px 1fr auto; gap:8px; align-items:baseline;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:5px 6px; border-radius:5px; font-size:13.5px; line-height:1.35; color:var(--gedaempft);
}
.kaplink:hover{background:var(--flaeche2); color:var(--tinte)}
.kaplink[aria-current="true"]{background:var(--akzent-weich); color:var(--tinte); font-weight:600}
.haken{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--akzent)}
.kaplink .dauer{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--gedaempft)}
.kaplink[data-erledigt="ja"] .titel{text-decoration:line-through; text-decoration-color:var(--linie)}

/* ---------- Kopfzeile mit Tagesplan ---------- */
.buehne{min-width:0; display:flex; flex-direction:column}
.tagesband{
  position:sticky; top:0; z-index:20; background:var(--flaeche);
  border-bottom:1px solid var(--linie);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:11px 30px;
}
.tagesband .block{display:flex; align-items:baseline; gap:7px}
.etikett{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--gedaempft)}
.wert{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:16px;
  font-variant-numeric:tabular-nums}
.balken{width:150px; height:7px; border-radius:4px; background:var(--flaeche2); overflow:hidden}
.balken i{display:block; height:100%; background:var(--heute); border-radius:4px; transition:width .3s}
.balken.voll i{background:var(--akzent)}
.tagesband select{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:3px 6px;
  border:1px solid var(--linie); border-radius:5px; background:var(--grund); color:var(--tinte);
}
.bandrest{margin-left:auto; display:flex; gap:8px; align-items:center}
.knopf{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:6px 11px;
  border:1px solid var(--linie); border-radius:6px; background:var(--flaeche); cursor:pointer;
}
.knopf:hover{border-color:var(--akzent); color:var(--akzent-tief)}
.knopf.stark{background:var(--akzent); border-color:var(--akzent); color:var(--flaeche); font-weight:500}
.knopf.stark:hover{background:var(--akzent-tief); color:var(--flaeche)}
.knopf[disabled]{opacity:.45; cursor:default}
.schienenknopf{display:none}

/* ---------- Lesespalte ---------- */
.blatt{padding:34px 30px 90px; max-width:820px; width:100%}
.pfad{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.06em;
  color:var(--gedaempft); text-transform:uppercase; margin-bottom:10px}
.blatt h1{font-size:clamp(28px,4.2vw,40px); letter-spacing:-.025em; margin-bottom:12px}
.ziel{font-size:19px; line-height:1.5; color:var(--tinte); margin:0 0 26px;
  border-left:3px solid var(--akzent); padding-left:14px}
.abschnitt{margin:0 0 30px}
.abschnitt > h2{
  font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:11px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--gedaempft);
  padding-bottom:6px; border-bottom:1px solid var(--linie); margin-bottom:14px;
}
.kernliste{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:13px}
.kernliste li{display:grid; grid-template-columns:22px 1fr; gap:10px; max-width:66ch}
.kernliste li::before{
  content:""; width:7px; height:7px; margin-top:.62em; border-radius:50%;
  background:var(--akzent); opacity:.55;
}
.kernliste b{font-weight:600}
code{font-family:"IBM Plex Mono",monospace; font-size:.86em; background:var(--flaeche2);
  padding:.1em .35em; border-radius:4px}

.praxis{background:var(--flaeche); border:1px solid var(--linie); border-radius:9px;
  padding:18px 20px; box-shadow:var(--schatten)}
.praxis h3{font-size:17px; margin-bottom:7px}
.praxis p{margin:0; max-width:62ch}
.selbstcheck{border-left:3px solid var(--heute); padding-left:14px; color:var(--tinte)}
.selbstcheck p{margin:0; max-width:62ch; font-style:italic}

.quellen{display:flex; flex-wrap:wrap; gap:8px}
.quelle{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  font-family:"IBM Plex Mono",monospace; font-size:12px;
  border:1px solid var(--linie); border-radius:20px; padding:6px 13px;
  color:var(--tinte); background:var(--flaeche);
}
.quelle:hover{border-color:var(--akzent); color:var(--akzent-tief)}
.quelle.film{background:var(--akzent-weich); border-color:transparent}
.quelle small{color:var(--gedaempft)}

textarea.notiz{
  width:100%; min-height:110px; resize:vertical; padding:12px 14px;
  border:1px solid var(--linie); border-radius:8px; background:var(--flaeche);
  color:var(--tinte); font-family:inherit; font-size:15.5px; line-height:1.55;
}
.notizstand{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gedaempft); margin-top:6px; display:block}

.fussleiste{display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  border-top:1px solid var(--linie); padding-top:20px; margin-top:34px}
.fussleiste .weiter{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gedaempft)}

/* ---------- Startansicht ---------- */
.aufschlag{display:grid; gap:8px; margin-bottom:32px}
.aufschlag h1{font-size:clamp(32px,5.5vw,52px); letter-spacing:-.03em}
.aufschlag p.lead{font-size:19px; max-width:60ch; color:var(--tinte); margin:6px 0 0}
.zahlenreihe{display:flex; gap:28px; flex-wrap:wrap; margin:24px 0 34px;
  padding:16px 0; border-top:1px solid var(--linie); border-bottom:1px solid var(--linie)}
.zahl{display:flex; flex-direction:column; gap:2px}
.zahl b{font-family:"Bricolage Grotesque",sans-serif; font-size:26px; font-variant-numeric:tabular-nums}
.heuteliste{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.heuteliste li{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline;
  padding:11px 4px; border-bottom:1px solid var(--linie); cursor:pointer}
.heuteliste li:hover .htitel{color:var(--akzent-tief)}
.heuteliste .hnr{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gedaempft)}
.htitel{font-weight:600}
.heuteliste .hfeld{display:block; font-size:13px; color:var(--gedaempft); font-weight:400}
.leer{color:var(--gedaempft); font-style:italic}

.felderraster{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1px;
  background:var(--linie); border:1px solid var(--linie)}
.feldkachel{background:var(--flaeche); padding:15px 16px; text-align:left; border:0; cursor:pointer;
  display:flex; flex-direction:column; gap:7px; min-height:112px}
.feldkachel:hover{background:var(--flaeche2)}
.feldkachel .knr{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--gedaempft); letter-spacing:.08em}
.feldkachel h3{font-size:15.5px}
.feldkachel .mini{margin-top:auto; height:4px; background:var(--flaeche2); border-radius:3px; overflow:hidden}
.feldkachel .mini i{display:block; height:100%; background:var(--akzent)}

.projekt{border:1px solid var(--linie); border-radius:9px; background:var(--flaeche);
  padding:18px 20px; display:flex; flex-direction:column; gap:8px}
.projekt .stufe{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--gedaempft)}
.projekt h3{font-size:18px}
.projekt ul{margin:0; padding-left:20px; max-width:62ch}
.projekte{display:flex; flex-direction:column; gap:14px}
.projekt[data-frei="nein"]{opacity:.62}
.marke-frei{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--akzent)}
.marke-zu{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--gedaempft)}

/* ---------- Lehrer-Rueckfrage ---------- */
.lehrer{border:1px dashed var(--linie); border-radius:9px; padding:16px 18px; background:var(--flaeche)}
.lehrer form{display:flex; gap:8px; flex-wrap:wrap}
.lehrer input{flex:1; min-width:220px; padding:9px 11px; border:1px solid var(--linie);
  border-radius:6px; background:var(--grund); color:var(--tinte); font-family:inherit; font-size:15px}
.antwort{margin-top:14px; white-space:pre-wrap; max-width:66ch; border-left:3px solid var(--akzent-weich); padding-left:14px}

.hinweis{font-size:13.5px; color:var(--gedaempft); max-width:64ch}
.trenner{height:1px; background:var(--linie); margin:34px 0}

@media (max-width:900px){
  .huelle{grid-template-columns:1fr}
  .schiene{position:fixed; z-index:40; width:302px; left:0; top:0; transform:translateX(-100%);
    transition:transform .22s ease; box-shadow:var(--schatten)}
  .schiene[data-offen="ja"]{transform:none}
  .schienenknopf{display:inline-flex}
  .blatt{padding:26px 20px 80px}
  .tagesband{padding:10px 18px; gap:14px}
  .balken{width:96px}
}
</style>

 nr:2, name:"HTML: Struktur und Bedeutung",
 kurz:"Das Skelett. Wer hier sauber baut, spart sich spaeter die Haelfte.",
 k:[
