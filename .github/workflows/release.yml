# Baut die Release-Datei auf GitHub statt auf dem Entwicklungsrechner
# und bescheinigt ihre Herkunft. Angelegt am 31.08.2026.
#
# WARUM, und das ist der eigentliche Punkt:
#
# Bisher entstand die exe lokal, und die Pruefsumme im Release-Text
# stammte vom selben Rechner. Das belegt nur, dass die Datei sich seit
# dem Hochladen nicht geaendert hat. Es belegt NICHT, dass sie aus dem
# Quelltext stammt, den jeder hier lesen kann. Wer misstraut, muss
# genau an dieser Stelle trotzdem vertrauen.
#
# Bei diesem Programm wiegt das schwerer als anderswo. Der uebliche
# Rat "starte es erst in einer virtuellen Maschine" hilft hier nicht:
# Das Werkzeug liest echte Hardware aus, in einer VM sieht es nur
# erfundene Geraete. Die Vorsichtsmassnahme, mit der sich sonst jeder
# behilft, faellt also weg.
#
# Der attest-build-provenance-Schritt schliesst die Luecke. Er bindet
# die Datei kryptografisch an diesen Lauf, diesen Commit und dieses
# Repository und schreibt den Beleg in ein oeffentliches, nicht mehr
# aenderbares Protokoll. Pruefen laesst sich das ohne uns:
#
#     gh attestation verify BenchMeister-PC-Check.exe \
#        --repo Dominic-Lutz85/benchmeister-pc-check
#
# Fuer oeffentliche Repositories ist das kostenlos.
#
# WINDOWS-RUNNER, NICHT LINUX: Ein Cross-Build auf Linux ergaebe eine
# andere Datei als der lokale Build und damit eine andere Pruefsumme.
# Das Versprechen aus release-bauen.ps1 ("bau es selbst und
# vergleiche") haelt nur, wenn hier dieselbe Umgebung laeuft.
#
# DIESELBEN SCHALTER wie in release-bauen.ps1, im README und im
# Release-Text. Wer sie hier aendert, muss sie dort mitaendern, sonst
# stimmt die Pruefsumme fuer niemanden mehr.

name: Release bauen und beglaubigen

on:
  release:
    types: [published]
  # Von Hand ausloesbar, zum Proben und zum Nachliefern.
  #
  # Ohne Angabe wird nur gebaut, die Datei haengt dann als Artefakt am
  # Lauf. Mit einem Tag wird dessen Stand gebaut und die Datei an das
  # zugehoerige Release gehaengt, bestehende ueberschrieben.
  #
  # Das Nachliefern kam am 31.08.2026 dazu, weil die Datei von v1.0.12
  # mit CGO gebaut worden war und sich deshalb nicht nachbauen liess.
  # Ohne diesen Weg haette das Release geloescht und neu angelegt
  # werden muessen.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag zum Nachliefern, z.B. v1.0.12. Leer lassen zum blossen Proben."
        required: false
        default: ""

permissions:
  contents: write      # Datei ans Release haengen
  id-token: write      # Kurzlebiges Zertifikat fuer die Beglaubigung
  attestations: write  # Beleg schreiben

jobs:
  bauen:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          # Beim Nachliefern der Stand des Tags, sonst der Stand, auf
          # dem der Lauf gestartet wurde. Wichtig: Der WORKFLOW kommt
          # immer aus dem Branch des Laufs, nur der Programmcode aus
          # dem Tag. Genau deshalb funktioniert das Nachliefern mit
          # einem Fix, den es im Tag selbst noch nicht gab.
          ref: ${{ inputs.tag || github.ref }}
          # Voller Verlauf, damit Go den Git-Stempel setzen kann. Mit
          # dem flachen Standard-Klon fehlt er, und die Pruefung weiter
          # unten schlaegt an.
          fetch-depth: 0

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Tests laufen lassen
        run: go test ./...

      # CGO_ENABLED=0 FEST GESETZT, und das ist der Kern der
      # Reproduzierbarkeit. Gefunden am 31.08.2026 beim Vergleich der
      # ersten ueber diesen Workflow gebauten Datei mit einem frischen
      # Klon: Die Pruefsummen wichen ab, und die eingebetteten Angaben
      # zeigten warum.
      #
      #   auf dem GitHub-Runner   CGO_ENABLED=1
      #   auf dem Entwicklungsrechner  CGO_ENABLED=0
      #
      # Go entscheidet das von selbst danach, ob ein C-Compiler im Pfad
      # liegt. Auf dem Runner liegt einer, auf einem gewoehnlichen
      # Windows-Rechner nicht. Damit ergibt derselbe Quelltext zwei
      # verschiedene Dateien, und das Versprechen "bau es selbst und
      # vergleiche die Pruefsumme" waere gebrochen.
      #
      # Das Programm braucht kein CGO: wmi und go-ole sind reines Go.
      - name: Bauen
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o BenchMeister-PC-Check.exe .

      - name: Git-Stempel pruefen
        shell: pwsh
        run: |
          $stempel = (go version -m BenchMeister-PC-Check.exe) -join "`n"
          if ($stempel -notmatch "vcs\.revision=") {
            Write-Host "::error::Die Datei traegt keinen Git-Stempel, die Pruefsumme waere an keinen Commit gebunden."
            exit 1
          }
          if ($stempel -match "vcs\.modified=true") {
            Write-Host "::error::Die Datei traegt den Vermerk 'geaendert'."
            exit 1
          }
          # Zweite Pruefung an derselben Stelle: Steht CGO wirklich
          # aus? Die env-Angabe oben kann bei einem Umbau verloren
          # gehen, und dann waere die Datei wieder unreproduzierbar,
          # ohne dass irgendetwas fehlschlaegt.
          if ($stempel -notmatch "CGO_ENABLED=0") {
            Write-Host "::error::Die Datei wurde mit CGO gebaut. Dann laesst sie sich auf einem Rechner ohne C-Compiler nicht nachbauen."
            exit 1
          }
          Write-Host "Git-Stempel vorhanden und sauber, CGO ist aus."

      - name: Pruefsumme ausgeben
        shell: pwsh
        run: |
          $summe = (Get-FileHash BenchMeister-PC-Check.exe -Algorithm SHA256).Hash
          $groesse = [math]::Round((Get-Item BenchMeister-PC-Check.exe).Length / 1MB, 2)
          Write-Host "SHA256 fuer den Release-Text: $summe"
          Write-Host "Groesse: $groesse MB"
          # Landet in der Zusammenfassung des Laufs, damit die Summe
          # nicht aus dem Protokoll gesucht werden muss.
          "## Pruefsumme`n`n``````$summe```````n`nGroesse: $groesse MB" `
            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Herkunft beglaubigen
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: BenchMeister-PC-Check.exe

      # Auch ohne Release herunterladbar, damit sich ein Probelauf
      # nachrechnen laesst. Ohne das steht die Pruefsumme nur im
      # Protokoll, und das ist ohne Anmeldung nicht abrufbar. Beim
      # Vergleich zweier Baustaende ist genau das aber die Frage.
      - name: Datei zum Nachrechnen anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: BenchMeister-PC-Check
          path: BenchMeister-PC-Check.exe
          # Sieben Tage genuegen. Was laenger aufgehoben werden soll,
          # gehoert an ein Release.
          retention-days: 7

      - name: An das Release haengen
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ZIEL: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$env:ZIEL" BenchMeister-PC-Check.exe --clobber
